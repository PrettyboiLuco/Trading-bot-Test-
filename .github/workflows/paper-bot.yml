# Runs bot/ against the Alpaca paper account around the clock.
# A GitHub job may run at most 6 hours, so each run stops after 5.75 hours
# and starts the next one itself (a chain), waiting through nights and
# weekends. GitHub's own schedule fired hours late on the first day, so the
# crons below are only a fallback that restarts the chain if it ever breaks
# (every 3 hours, and hourly while the US market is open).
# The concurrency group never lets two runs trade at once.
# To pause the bot: Settings > Secrets and variables > Actions > Variables,
# add BOT_PAUSED = true (delete it to resume, then start a run by hand).
name: Paper-Trading-Bot

on:
  schedule:
    - cron: "11 */3 * * *"
    - cron: "41 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      selftest:
        description: "Only check Alpaca and Yahoo, no trading"
        type: boolean
        default: false

concurrency:
  group: paper-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  trade:
    if: vars.BOT_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the bot
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          if [ -z "$APCA_API_KEY_ID" ] || [ -z "$APCA_API_SECRET_KEY" ]; then
            echo "::error::Add APCA_API_KEY_ID and APCA_API_SECRET_KEY under Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ "${{ inputs.selftest }}" = "true" ]; then
            python bot/bot.py --selftest
          else
            python bot/bot.py --max-hours 5.75
          fi

      - name: Summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 bot/trader/bot.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-${{ github.run_id }}
          path: bot/trader/
          retention-days: 30
          if-no-files-found: ignore

      # Start the next run. Skipped for a selftest, a cancelled run, or a run
      # that ended within 20 minutes (a crash loop waits for the cron instead).
      - name: Start the next run
        if: ${{ !cancelled() && inputs.selftest != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ $(( $(date +%s) - STARTED )) -lt 1200 ]; then
            echo "::warning::Run ended within 20 minutes; not chaining. The cron restarts the bot."
            exit 0
          fi
          gh workflow run paper-bot.yml --ref "${{ github.ref_name }}"
